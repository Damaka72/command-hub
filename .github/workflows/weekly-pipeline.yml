name: Weekly Content Pipeline

on:
  schedule:
    # Runs at 07:00 UTC every Sunday (8am BST / 7am GMT).
    # One run generates the whole week's briefs (5 sites x 5 days),
    # so there is no need to run it daily.
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      site:
        description: 'Run for a single site only (e.g. masteryourcareerpath). Leave blank for all sites.'
        required: false
        default: ''

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write .env.local
        run: |
          cat > .env.local <<EOF
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          BLOTATO_API_KEY=${{ secrets.BLOTATO_API_KEY }}
          EOF

      - name: Run pipeline (all sites)
        if: ${{ github.event.inputs.site == '' }}
        run: npm run pipeline

      - name: Run pipeline (single site)
        if: ${{ github.event.inputs.site != '' }}
        run: npm run pipeline -- --site ${{ github.event.inputs.site }}
